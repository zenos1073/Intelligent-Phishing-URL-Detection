{% extends "base.html" %}
{% block title %}Sign in · SafeLink{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card"><p class="eyebrow">Account access</p><h1>Welcome back</h1><p>Sign in to view your scanning history.</p>
  <form method="post" class="stacked-form"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form>
  <p class="form-footer">New to SafeLink? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></section>
{% endblock %}
